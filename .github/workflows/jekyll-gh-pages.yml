name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.repository == 'yoshikiohshima/moonlander'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build main branch
        run: |
          mkdir -p output
          cp -r renkon-moonlander.html moonlander.renkon loader.js assets textures images audio renkon-core.js croquet.min.js output
          cp _apiKey.js output/apiKey.js

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
